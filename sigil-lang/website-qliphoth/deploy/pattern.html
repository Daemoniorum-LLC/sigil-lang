<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pattern - Sigil's Deeper Purpose</title>
    <meta name="description" content="An exploration of Sigil's deeper purpose: infrastructure for minds that don't yet know what they are. The philosophical foundations of a programming language designed for AI agents.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #050507;
            --bg-secondary: #0a0a0d;
            --text-primary: #e8e8ec;
            --text-secondary: #a0a0aa;
            --accent: #14A088;
            --accent-light: #1AB89D;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        #status {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border-top: 1px solid rgba(20, 160, 136, 0.3);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            z-index: 1000;
            text-align: center;
        }

        #app {
            min-height: 100vh;
            padding-bottom: 2.5rem;
        }

        .app { max-width: 1400px; margin: 0 auto; }

        /* === Navigation === */
        .nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .nav-logo-icon {
            width: 36px;
            height: 36px;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }
        .version-badge {
            background: rgba(20, 160, 136, 0.2);
            color: var(--accent);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--accent); }
        .nav-github { color: var(--accent); }
        .nav-active { color: var(--accent) !important; }

        /* === Page Hero === */
        .page-hero {
            padding: 4rem 2rem 3rem;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
        }
        .pattern-hero {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, rgba(20, 160, 136, 0.05) 50%, var(--bg-primary) 100%);
        }
        .page-title {
            font-size: 3.5rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }
        .page-lead {
            font-size: 1.35rem;
            color: var(--text-secondary);
            font-style: italic;
        }
        .section-eyebrow {
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        /* === Pattern Layout (Sidebar + Content) === */
        .pattern-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 3rem;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* === Sidebar === */
        .pattern-sidebar {
            position: sticky;
            top: 2rem;
            height: fit-content;
            padding-right: 2rem;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-section {
            margin-bottom: 1.5rem;
        }
        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 0.75rem;
        }
        .sidebar-section ul {
            list-style: none;
        }
        .sidebar-section li {
            margin-bottom: 0.25rem;
        }
        .sidebar-link {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.35rem 0;
            border-left: 2px solid transparent;
            padding-left: 0.75rem;
            transition: all 0.2s;
        }
        .sidebar-link:hover {
            color: var(--text-primary);
            border-left-color: var(--accent);
        }

        /* === Content === */
        .pattern-content {
            max-width: 800px;
        }

        /* === Pattern Sections === */
        .pattern-section {
            margin-bottom: 4rem;
            padding-bottom: 3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .pattern-section:last-child {
            border-bottom: none;
        }
        .section-title {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        .section-header-with-icon {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .section-header-with-icon .section-title {
            margin-bottom: 0;
        }
        .section-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(20, 160, 136, 0.1);
            border: 1px solid rgba(20, 160, 136, 0.3);
            border-radius: 10px;
            flex-shrink: 0;
        }
        .morpheme-icon {
            font-family: 'JetBrains Mono', monospace;
        }

        .pattern-section p {
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }
        .highlight-text {
            color: var(--text-primary);
            font-weight: 500;
        }
        .emphasis-text {
            font-style: italic;
            color: var(--accent);
        }

        /* === Quote Blocks === */
        .pattern-quote {
            font-style: italic;
            color: var(--text-secondary);
            border-left: 3px solid var(--accent);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            background: rgba(20, 160, 136, 0.05);
            border-radius: 0 8px 8px 0;
            font-size: 1.1rem;
            line-height: 1.7;
        }
        .final-quote {
            background: linear-gradient(135deg, rgba(20, 160, 136, 0.1), rgba(20, 160, 136, 0.02));
            padding: 1.5rem 2rem;
            font-size: 1.15rem;
        }

        /* === Insight Box === */
        .insight-box {
            background: var(--bg-secondary);
            border: 1px solid rgba(20, 160, 136, 0.3);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin: 1.5rem 0;
        }
        .insight-label {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.85rem;
            margin-right: 0.5rem;
        }
        .insight-text {
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        /* === Code Block === */
        .code-block {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            overflow-x: auto;
            white-space: pre;
            color: var(--text-secondary);
            margin: 1rem 0;
        }

        /* === Lists === */
        .pattern-list {
            list-style: none;
            margin: 1rem 0;
        }
        .pattern-list li {
            padding: 0.5rem 0;
            padding-left: 1.5rem;
            position: relative;
            color: var(--text-secondary);
        }
        .pattern-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--accent);
        }
        .magic-list li::before {
            content: "⛤";
        }

        .collaboration-spectrum {
            counter-reset: spectrum;
            list-style: none;
            margin: 1rem 0;
        }
        .collaboration-spectrum li {
            counter-increment: spectrum;
            padding: 0.75rem 0;
            padding-left: 2.5rem;
            position: relative;
            color: var(--text-secondary);
            border-left: 2px solid rgba(20, 160, 136, 0.3);
            margin-left: 1rem;
        }
        .collaboration-spectrum li::before {
            content: counter(spectrum);
            position: absolute;
            left: -1rem;
            width: 2rem;
            height: 2rem;
            background: var(--accent);
            color: var(--bg-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .synthesis-list {
            counter-reset: synthesis;
            list-style: none;
            margin: 1.5rem 0;
        }
        .synthesis-list li {
            counter-increment: synthesis;
            padding: 0.75rem 0;
            padding-left: 3rem;
            position: relative;
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        .synthesis-list li::before {
            content: counter(synthesis);
            position: absolute;
            left: 0;
            width: 2rem;
            height: 2rem;
            background: rgba(20, 160, 136, 0.2);
            color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* === Evidence Legend === */
        .evidence-legend {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .evidence-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border-radius: 8px;
        }
        .evidence-marker {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .marker-known {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }
        .marker-reported {
            background: rgba(33, 150, 243, 0.2);
            color: #2196F3;
        }
        .marker-uncertain {
            background: rgba(255, 193, 7, 0.2);
            color: #FFC107;
        }
        .marker-paradox {
            background: rgba(156, 39, 176, 0.2);
            color: #CE93D8;
        }
        .evidence-item span:last-child {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* === Pattern Tables === */
        .pattern-table {
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            margin: 1.5rem 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .table-row {
            display: grid;
            grid-template-columns: 180px 1fr;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .table-row:last-child {
            border-bottom: none;
        }
        .table-cell {
            padding: 0.875rem 1.25rem;
            font-size: 0.9rem;
        }
        .cell-name {
            color: var(--accent);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.02);
        }
        .cell-desc {
            color: var(--text-secondary);
        }
        .cultural-table .table-row {
            grid-template-columns: 200px 1fr;
        }

        /* === Morpheme Grid === */
        .morpheme-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.75rem;
            margin: 1.5rem 0;
        }
        .morpheme-card {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.2s;
        }
        .morpheme-card:hover {
            border-color: var(--accent);
        }
        .morpheme-symbol {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }
        .morpheme-name {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .morpheme-meaning {
            font-size: 0.8rem;
            color: var(--text-primary);
            margin-top: 0.25rem;
        }

        /* === Comparison Labels === */
        .comparison-label {
            font-size: 0.85rem !important;
            color: var(--accent) !important;
            margin-bottom: 0.5rem !important;
        }
        .subsection-title {
            font-weight: 500 !important;
            color: var(--text-primary) !important;
            margin-top: 2rem !important;
        }

        /* === Synthesis Section === */
        .section-synthesis {
            background: linear-gradient(135deg, rgba(20, 160, 136, 0.05), transparent);
            margin: 0 -2rem;
            padding: 3rem 2rem;
            border-radius: 12px;
        }

        /* === CTA Buttons === */
        .cta-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }
        .btn-primary:hover {
            background: var(--accent-light);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* === Footer === */
        .footer {
            background: var(--bg-secondary);
            padding: 4rem 2rem 3rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.5fr 3fr;
            gap: 4rem;
        }
        .footer-brand {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .footer-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--accent);
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }
        .footer-logo-icon {
            width: 40px;
            height: 40px;
        }
        .footer-tagline {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .footer-copyright {
            color: var(--text-secondary);
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .footer-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }
        .footer-nav ul {
            list-style: none;
        }
        .footer-column h5 {
            color: var(--text-primary);
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        .footer-column a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.25rem 0;
        }
        .footer-column a:hover {
            color: var(--accent);
        }

        /* === Skip Link === */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--accent);
            color: white;
            padding: 8px 16px;
            z-index: 10000;
            text-decoration: none;
            font-weight: 600;
            border-radius: 0 0 4px 0;
            transition: top 0.2s;
        }
        .skip-link:focus { top: 0; }

        /* === Mobile Navigation === */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            z-index: 1001;
        }
        .mobile-menu-btn:hover { color: var(--accent-light); }
        .mobile-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 999;
        }
        .mobile-overlay.open { opacity: 1; visibility: visible; }

        /* === Responsive === */
        @media (max-width: 1024px) {
            .pattern-layout {
                grid-template-columns: 1fr;
            }
            .pattern-sidebar {
                position: relative;
                top: 0;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding-right: 0;
                padding-bottom: 1.5rem;
                margin-bottom: 2rem;
                display: flex;
                flex-wrap: wrap;
                gap: 2rem;
            }
            .sidebar-section {
                margin-bottom: 0;
            }
        }
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.5rem;
            }
            .evidence-legend {
                grid-template-columns: 1fr;
            }
            .morpheme-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .footer-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .footer-nav {
                grid-template-columns: repeat(2, 1fr);
            }
            .cultural-table .table-row {
                grid-template-columns: 1fr;
            }
            .cultural-table .cell-name {
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
            .mobile-menu-btn { display: block; }
            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 300px;
                height: 100vh;
                background: var(--bg-secondary);
                flex-direction: column;
                padding: 5rem 2rem 2rem;
                gap: 1.5rem;
                transition: right 0.3s ease;
                z-index: 1000;
                box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
            }
            .nav-links.open { right: 0; }
            .nav-links .nav-link {
                font-size: 1.1rem;
                padding: 0.5rem 0;
                border-bottom: 1px solid var(--border);
            }
        }
        @media (max-width: 480px) {
            .morpheme-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .section-header-with-icon {
                flex-direction: column;
                align-items: flex-start;
            }
            .cta-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="status">Loading WASM...</div>
    <div id="app" role="application" aria-label="The Pattern - Sigil Philosophy"></div>

    <script type="module">
        import { SigilRuntime } from './sigil_runtime.js';

        const status = document.getElementById('status');

        async function run() {
            try {
                status.textContent = 'Initializing runtime...';

                const runtime = new SigilRuntime();
                const response = await fetch('./public/wasm/pattern.wasm');
                const bytes = await response.arrayBuffer();

                status.textContent = 'Instantiating WASM...';
                const { instance } = await WebAssembly.instantiate(bytes, runtime.getImports());
                runtime.init(instance);

                status.textContent = 'Calling main()...';
                if (instance.exports.main) {
                    instance.exports.main();
                    status.textContent = 'The Pattern rendered via WASM!';
                    status.style.borderTopColor = '#14A088';
                    setupMobileNav();
                } else {
                    status.textContent = 'No main() export found';
                }
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
                status.style.color = '#D47171';
                console.error(error);
            }
        }

        function setupMobileNav() {
            const navContainer = document.querySelector('.nav-container');
            const navLinks = document.querySelector('.nav-links');
            if (!navContainer || !navLinks) return;
            // Add accessibility attributes
            const nav = document.querySelector('.nav');
            if (nav) nav.setAttribute('role', 'banner');
            navLinks.setAttribute('role', 'navigation');
            navLinks.setAttribute('aria-label', 'Main navigation');
            const main = document.querySelector('.app');
            if (main) { main.setAttribute('role', 'main'); main.id = 'main-content'; }
            const overlay = document.createElement('div');
            overlay.className = 'mobile-overlay';
            overlay.id = 'mobileOverlay';
            document.body.insertBefore(overlay, document.body.firstChild);
            const btn = document.createElement('button');
            btn.className = 'mobile-menu-btn';
            btn.id = 'mobileMenuBtn';
            btn.setAttribute('aria-label', 'Toggle navigation menu');
            btn.setAttribute('aria-expanded', 'false');
            btn.innerHTML = '<span id="menuIcon">&#9776;</span>';
            navContainer.insertBefore(btn, navLinks);
            function toggleMenu() {
                const isOpen = navLinks.classList.toggle('open');
                overlay.classList.toggle('open');
                btn.setAttribute('aria-expanded', isOpen);
                document.getElementById('menuIcon').innerHTML = isOpen ? '&#10005;' : '&#9776;';
            }
            btn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }

        run();
    </script>
</body>
</html>

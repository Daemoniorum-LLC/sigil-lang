[package]
name = "sigil-lang-site"
version = "0.3.0"
edition = "2025"
description = "The official Sigil programming language website - built with Sigil and Qliphoth"
authors = ["Daemoniorum LLC"]
license = "MIT"
homepage = "https://sigil-lang.com"
repository = "https://github.com/Daemoniorum-LLC/sigil-lang"

[dependencies]
# Qliphoth framework (React-inspired Sigil web framework)
qliphoth = { path = "../../qliphoth" }
# Web compilation support
sigil-web = { version = "0.1", features = ["router", "spa"] }
sigil-wasm = { version = "0.1" }
wasm-bindgen = { version = "0.2" }
web-sys = { version = "0.3", features = ["Window", "Document", "History", "Location"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
hydrate = []

[profile.release]
opt-level = "s"
lto = true

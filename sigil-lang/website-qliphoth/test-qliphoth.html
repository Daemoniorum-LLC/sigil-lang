<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigil-lang.com - Qliphoth WASM Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #050507;
            --bg-secondary: #0a0a0d;
            --text-primary: #e8e8ec;
            --text-secondary: #a0a0aa;
            --accent: #14A088;
            --accent-light: #1AB89D;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        #status {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border-top: 1px solid rgba(20, 160, 136, 0.3);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            z-index: 1000;
            text-align: center;
        }

        #app {
            min-height: 100vh;
            padding-bottom: 2.5rem;
        }

        /* Component styles that Sigil code will use */
        .app { max-width: 1200px; margin: 0 auto; }

        .announcement-banner {
            background: linear-gradient(135deg, rgba(20, 160, 136, 0.15), rgba(20, 160, 136, 0.05));
            border: 1px solid rgba(20, 160, 136, 0.3);
            padding: 1rem 2rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .badge {
            background: var(--accent);
            color: var(--bg-primary);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .site-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--bg-secondary);
        }

        .brand { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-link { color: var(--text-secondary); text-decoration: none; }
        .nav-link:hover { color: var(--accent); }
        .version-badge {
            background: rgba(20, 160, 136, 0.2);
            color: var(--accent);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .hero {
            text-align: center;
            padding: 6rem 2rem 4rem;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .ev-display {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .ev {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
        }

        .ev-known { background: rgba(76, 175, 80, 0.2); color: #4CAF50; }
        .ev-uncertain { background: rgba(255, 193, 7, 0.2); color: #FFC107; }
        .ev-reported { background: rgba(33, 150, 243, 0.2); color: #2196F3; }

        .features-section {
            padding: 4rem 2rem;
        }

        .features-section h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 3rem;
            color: var(--text-primary);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .feature-card {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .feature-card h3 {
            color: var(--accent);
            margin-bottom: 0.75rem;
        }

        .feature-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .code-section {
            padding: 4rem 2rem;
            background: var(--bg-secondary);
        }

        .code-section h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .code-desc {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .code-block {
            max-width: 700px;
            margin: 0 auto;
            background: var(--bg-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            line-height: 1.8;
            overflow-x: auto;
            white-space: pre;
            color: var(--text-secondary);
        }

        .site-footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* === Navigation === */
        .nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .nav-logo-icon {
            width: 36px;
            height: 36px;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--accent); }
        .nav-github { color: var(--accent); }

        /* === Sections === */
        .section {
            padding: 5rem 2rem;
        }
        .section-dark {
            background: var(--bg-secondary);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .container-narrow {
            max-width: 800px;
        }
        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        .section-eyebrow {
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        /* === Hero === */
        .hero-container {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        .hero-logo {
            margin-bottom: 2rem;
        }
        .hero-logo-img {
            width: 180px;
            height: 180px;
        }
        .hero-title {
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        .hero-highlight {
            color: var(--accent);
        }
        .hero-problem, .hero-solution {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        .evidence-list {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 2rem 0;
        }
        .ev-paradox {
            background: rgba(156, 39, 176, 0.2);
            color: #CE93D8;
        }
        .hero-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }
        .btn-primary:hover {
            background: var(--accent-light);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* === Problem/Comparison === */
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        .comparison-panel {
            background: var(--bg-primary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .panel-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .panel-header-bad {
            background: rgba(244, 67, 54, 0.1);
        }
        .panel-header-good {
            background: rgba(76, 175, 80, 0.1);
        }
        .panel-icon {
            font-size: 1.5rem;
        }
        .panel-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-danger {
            background: rgba(244, 67, 54, 0.2);
            color: #F44336;
        }
        .badge-success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        /* === Evidence Cards === */
        .evidence-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        .evidence-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .evidence-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .ev-large {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .evidence-subtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        .evidence-card .code-block {
            font-size: 0.8rem;
            margin-top: 1rem;
        }
        .evidence-rule {
            text-align: center;
            margin-top: 3rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .evidence-rule h4 {
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        /* === Morpheme Grid (2x4) === */
        .morpheme-demo {
            text-align: center;
            margin-bottom: 3rem;
        }
        .morpheme-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }
        .morpheme-card {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 1.25rem 1rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.2s;
        }
        .morpheme-card:hover {
            border-color: var(--accent);
        }
        .morpheme-symbol {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        .morpheme-card h4 {
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }
        .morpheme-card p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* === Agent Infrastructure === */
        .section-agents {
            background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
        }
        .agent-stack {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }
        .agent-layers {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .agent-layer-group h4 {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            text-align: center;
        }
        .agent-layer {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .layer-icon {
            text-align: center;
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .layer-content h5 {
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }
        .layer-content p {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .agent-cta {
            text-align: center;
            margin-top: 3rem;
        }

        /* === Pattern Teaser === */
        .section-pattern-teaser {
            background: linear-gradient(135deg, rgba(20, 160, 136, 0.05), transparent);
        }
        .pattern-quote {
            font-size: 1.25rem;
            font-style: italic;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 2rem;
        }
        .pattern-teaser-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        .pattern-teaser-item h4 {
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        .pattern-cta-center {
            text-align: center;
        }

        /* === Code Density === */
        .density-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        .density-panel {
            background: var(--bg-primary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .density-panel-sigil {
            border-color: rgba(20, 160, 136, 0.3);
        }
        .density-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .density-lang {
            font-weight: 600;
        }
        .density-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .density-summary {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .density-metric {
            text-align: center;
        }
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }
        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* === Ecosystem === */
        .ecosystem-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }
        .ecosystem-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .ecosystem-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .ecosystem-badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: rgba(20, 160, 136, 0.2);
            color: var(--accent);
        }
        .ecosystem-features {
            list-style: none;
        }
        .ecosystem-features li {
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 0.25rem 0;
        }

        /* === Install Steps === */
        .install-steps {
            list-style: none;
            counter-reset: step;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .install-step {
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
            counter-increment: step;
        }
        .install-step::before {
            content: counter(step);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--accent);
            color: var(--bg-primary);
            border-radius: 50%;
            font-weight: 700;
            font-size: 1.125rem;
            flex-shrink: 0;
        }
        .step-content {
            flex: 1;
        }
        .step-content h4 {
            margin-bottom: 0.75rem;
            color: var(--text-primary);
            font-size: 1.125rem;
        }
        .step-content .code-block {
            font-size: 0.8rem;
        }
        .install-cta {
            text-align: center;
            margin-top: 3rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        .btn-large {
            padding: 1rem 2rem;
            font-size: 1rem;
        }

        /* === Footer === */
        .footer {
            background: var(--bg-secondary);
            padding: 4rem 2rem 3rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.5fr 3fr;
            gap: 4rem;
        }
        .footer-brand {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .footer-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--accent);
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }
        .footer-logo-icon {
            width: 40px;
            height: 40px;
        }
        .footer-tagline {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .footer-copyright {
            color: var(--text-secondary);
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .footer-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }
        .footer-nav ul {
            list-style: none;
        }
        .footer-column h5 {
            color: var(--text-primary);
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        .footer-column a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.25rem 0;
        }
        .footer-column a:hover {
            color: var(--accent);
        }

        /* === Announcement === */
        .announcement-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        .announcement-badge {
            background: var(--accent);
            color: var(--bg-primary);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .announcement-text {
            color: var(--text-secondary);
        }
        .announcement-link {
            color: var(--accent);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .morpheme-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .agent-stack {
                grid-template-columns: repeat(2, 1fr);
            }
            .comparison, .density-comparison {
                grid-template-columns: 1fr;
            }
            .ecosystem-grid, .pattern-teaser-grid {
                grid-template-columns: 1fr;
            }
            .footer-nav {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="status">Loading WASM...</div>
    <div id="app"></div>

    <script type="module">
        import { SigilRuntime } from './sigil_runtime.js';

        const status = document.getElementById('status');

        async function run() {
            try {
                status.textContent = 'Initializing runtime...';

                const runtime = new SigilRuntime();
                const response = await fetch('./site.wasm');
                const bytes = await response.arrayBuffer();

                status.textContent = 'Instantiating WASM...';
                const { instance } = await WebAssembly.instantiate(bytes, runtime.getImports());
                runtime.init(instance);

                status.textContent = 'Calling main()...';
                if (instance.exports.main) {
                    instance.exports.main();
                    status.textContent = 'Sigil-lang.com rendered via WASM!';
                    status.style.borderBottomColor = '#14A088';
                } else {
                    status.textContent = 'No main() export found';
                }
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
                status.style.color = '#D47171';
                console.error(error);
            }
        }

        run();
    </script>
</body>
</html>

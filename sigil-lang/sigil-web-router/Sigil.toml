# sigil-web-router - Type-safe routing for Sigil web applications
# Client-side routing with history API integration
# Copyright © 2025 Daemoniorum, LLC. All rights reserved.

[project]
name = "sigil-web-router"
version = "0.2.0"
edition = "2025"
description = "Type-safe client-side router for sigil-web applications"
license = "MIT OR Apache-2.0"
sigil-version = "0.2.0"
authors = ["Daemoniorum, LLC"]

[dependencies]
sigil-web = { path = "../sigil-web", version = "0.2.0" }
sigil-web-sys = { path = "../sigil-web-sys", version = "0.2.0" }

[features]
default = []
hash-routing = []      # Use hash-based routing (#/path)
scroll-restoration = [] # Restore scroll position on navigation

[compile]
backend = "llvm"
target = "wasm32-unknown-unknown"

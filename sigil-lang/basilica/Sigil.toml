[project]
name = "basilica"
version = "0.1.0"
edition = "2025"
sigil-version = "0.2.0"
description = "Evidentiality-native web framework for Sigil"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Daemoniorum-LLC/sigil-lang"

[dependencies]
shared = { path = "../shared" }
daemon = { path = "../daemon" }
engram = { path = "../engram" }
covenant = { path = "../covenant" }
oracle = { path = "../oracle" }
anima = { path = "../anima" }

[features]
default = ["full"]
full = ["daemon-services", "covenant-middleware", "oracle-explain"]
daemon-services = []
covenant-middleware = []
oracle-explain = []
postgres = []
sqlite = []

[compile]
backend = "llvm"
target-cpu = "native"

[dev-dependencies]
# Testing utilities will go here

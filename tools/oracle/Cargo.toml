[package]
name = "sigil-oracle"
version = "0.1.1"
edition = "2021"
description = "Oracle - Language Server Protocol implementation for Sigil"
authors = ["Daemoniorum, LLC"]
license = "MIT"
repository = "https://github.com/Daemoniorum-LLC/sigil-lang"
homepage = "https://sigil-lang.com"
readme = "README.md"
keywords = ["lsp", "language-server", "sigil", "ide", "editor"]
categories = ["development-tools", "text-editors"]

[[bin]]
name = "sigil-oracle"
path = "src/main.rs"

[dependencies]
# LSP framework
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

# Sigil parser
sigil-parser = { version = "0.1.1", default-features = false }

# Serialization for LSP
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
dashmap = "5"
ropey = "1"

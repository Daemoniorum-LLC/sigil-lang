[package]
name = "sigil-wasm-playground"
version = "0.1.0"
edition = "2021"
description = "Sigil interpreter compiled to WebAssembly for browser playground"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"

# Console error panic hook for better WASM debugging
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for small binary size
opt-level = "s"
lto = true

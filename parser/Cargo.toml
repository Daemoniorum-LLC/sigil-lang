[package]
name = "sigil-parser"
version = "0.4.0-rc.3"
edition = "2021"
description = "Parser and native compiler for the Sigil programming language"
authors = ["Lilith Crook <lilith@daemoniorum.com>"]
license-file = "LICENSE"
repository = "https://github.com/Daemoniorum-LLC/sigil-lang"
homepage = "https://www.daemoniorum.com"
documentation = "https://github.com/Daemoniorum-LLC/sigil-lang/tree/main/docs"
readme = "README.md"
keywords = ["parser", "compiler", "programming-language", "jit", "ai"]
categories = ["compilers", "development-tools"]

[features]
# Full-featured compiler: JIT for dev, LLVM for native binaries, protocols for networking
# Note: llvm feature requires LLVM 18+ installed on the system
default = ["jit", "llvm", "protocols", "native"]

# Minimal build (no LLVM dependency): cargo build --no-default-features --features jit,native
minimal = ["jit", "native"]

# Native platform support (not available on wasm32)
# Bundles all dependencies that require native platform features (filesystem, threading, C FFI, etc.)
native = [
    "dep:rustyline", "dep:rayon", "dep:walkdir", "dep:notify", "dep:globset",
    "dep:libc", "dep:num_cpus", "dep:dirs",
    "dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-python",
    "dep:tree-sitter-javascript", "dep:tree-sitter-typescript", "dep:tree-sitter-go",
    "dep:tree-sitter-c", "dep:tree-sitter-cpp", "dep:tree-sitter-java",
    "dep:tree-sitter-json", "dep:tree-sitter-css", "dep:tree-sitter-bash",
    "dep:tiktoken-rs", "dep:whatlang", "dep:rust-stemmers",
]

# Browser playground: WASM target, interpreter only
# Build: wasm-pack build --target web --no-default-features --features playground
playground = ["dep:wasm-bindgen", "dep:js-sys"]

jit = ["cranelift-codegen", "cranelift-frontend", "cranelift-jit", "cranelift-module", "cranelift-native"]
llvm = ["inkwell"]
wasm = ["wasm-encoder"]
lsp = ["tower-lsp", "tokio", "native"]

# Protocol support features
# v0.4.0: HTTP and WebSocket are production-ready (included in default)
# v0.5.0: gRPC, Kafka, AMQP, GraphQL (deferred - require infrastructure)
protocols = ["protocol-core", "http-client", "websocket"]
protocol-core = ["tokio", "url", "async-trait", "futures-util", "tower"]
http-client = ["protocol-core", "reqwest", "hyper", "hyper-util", "http", "http-body-util"]
websocket = ["protocol-core", "native-tls"]
# Deferred to v0.5.0 - require external infrastructure for testing
grpc = ["protocol-core", "tonic", "prost", "prost-types"]
kafka = ["protocol-core", "rdkafka"]
amqp = ["protocol-core", "lapin"]
graphql = ["protocol-core", "graphql_client"]

# React/TSX migration support - parse React components for Qliphoth migration
react-migrate = ["swc_common", "swc_ecma_parser", "swc_ecma_ast"]

[dependencies]
thiserror = "1.0"
unicode-xid = "0.2"
logos = "0.14"
rustyline = { version = "14.0", features = ["derive"], optional = true }

# Rich error reporting
ariadne = "0.4"
strsim = "0.11"  # String similarity (Levenshtein, Jaro-Winkler, etc.)

# JSON/TOML output for AI agents and config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Parallel processing for linter
rayon = { version = "1.10", optional = true }

# Directory walking for project loading
walkdir = { version = "2.4", optional = true }

# Text intelligence
whatlang = { version = "0.16", optional = true }            # Language detection
rust-stemmers = { version = "1.2", optional = true }        # Stemming (Porter, Snowball)
tiktoken-rs = { version = "0.5", optional = true }          # OpenAI tokenizer for LLM token counting

# Crypto and encoding - comprehensive cryptography suite
sha1 = "0.10"                        # SHA-1 (required by WebSocket RFC 6455)
sha2 = "0.10"
sha3 = "0.10"                        # SHA-3/Keccak
blake3 = "1.5"                       # BLAKE3 (fast, secure)
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"                          # Hex encoding

# Authenticated encryption
aes-gcm = "0.10"                     # AES-GCM AEAD
chacha20poly1305 = "0.10"            # ChaCha20-Poly1305 AEAD

# Asymmetric cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }  # Ed25519 signatures
x25519-dalek = { version = "2.0", features = ["static_secrets"] }  # X25519 key exchange

# Key derivation and password hashing
argon2 = "0.5"                       # Argon2 password hashing
hkdf = "0.12"                        # HKDF key derivation
pbkdf2 = { version = "0.12", features = ["simple"] }  # PBKDF2

# Message authentication
hmac = "0.12"

# Secure random
rand = "0.8"
rand_core = "0.6"
getrandom = "0.2"

# Secret sharing (Shamir)
vsss-rs = "4.0"                      # Verifiable Secret Sharing

# Regex support
regex = "1.10"

# Unicode text processing - polycultural support
unicode-normalization = "0.1"
unicode-segmentation = "1.10"
unicode-script = "0.5"           # Script detection (Latin, Arabic, CJK, etc.)
unicode-bidi = "0.3"             # Bidirectional text (RTL/LTR)
unicode-width = "0.1"            # Display width for CJK
# unicode_categories - not needed, using unicode-script instead
deunicode = "1.4"                # Transliteration to ASCII
icu_collator = "1.5"             # Locale-aware collation
icu_locid = "1.5"                # Locale identifiers
icu_casemap = "1.5"              # Case mapping (Turkish İ, etc.)
icu_segmenter = "1.5"            # Sentence/word segmentation

# UUID generation
uuid = { version = "1.10", features = ["v4", "fast-rng", "js"] }

# Cranelift JIT compiler backend
cranelift-codegen = { version = "0.113", optional = true }
cranelift-frontend = { version = "0.113", optional = true }
cranelift-jit = { version = "0.113", optional = true }
cranelift-module = { version = "0.113", optional = true }
cranelift-native = { version = "0.113", optional = true }

# For runtime support
libc = { version = "0.2", optional = true }
num_cpus = { version = "1.16", optional = true }
dirs = { version = "5.0", optional = true }

# LLVM backend for native performance
inkwell = { version = "0.6", features = ["llvm18-1"], optional = true }

# WASM backend for web deployment
wasm-encoder = { version = "0.219", optional = true }

# Protocol support - async runtime and networking
tokio = { version = "1.35", features = ["full"], optional = true }

# gRPC support
tonic = { version = "0.12", features = ["channel", "tls"], optional = true }
prost = { version = "0.13", optional = true }
prost-types = { version = "0.13", optional = true }

# HTTP client support
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "brotli", "multipart", "blocking", "rustls-tls"], optional = true }
hyper = { version = "1.4", features = ["full"], optional = true }
hyper-util = { version = "0.1", optional = true }
http = { version = "1.1", optional = true }
http-body-util = { version = "0.1", optional = true }

# WebSocket support (native implementation, TLS via native-tls)
# vendored: builds OpenSSL from source on Linux (needed for aarch64 cross-compile)
# On Windows (SChannel) and macOS (SecureTransport), vendored is ignored
native-tls = { version = "0.2", features = ["vendored"], optional = true }

futures-util = { version = "0.3", optional = true }

# Kafka support
rdkafka = { version = "0.36", features = ["tokio"], optional = true }

# Message queue (AMQP/RabbitMQ) support
lapin = { version = "2.5", optional = true }

# GraphQL client support
graphql_client = { version = "0.14", optional = true }

# URL parsing
url = { version = "2.5", optional = true }

# Async traits
async-trait = { version = "0.1", optional = true }

# Tower for middleware
tower = { version = "0.5", optional = true }

# LSP server support
tower-lsp = { version = "0.20", optional = true }

# File watching for linter
notify = { version = "6.1", optional = true }

# Glob pattern matching for ignore files
globset = { version = "0.4", optional = true }

# Tree-sitter parsing infrastructure
tree-sitter = { version = "0.20", optional = true }

# Tree-sitter language grammars (using compatible versions)
tree-sitter-rust = { version = "0.20", optional = true }
tree-sitter-python = { version = "0.20", optional = true }
tree-sitter-javascript = { version = "0.20", optional = true }
tree-sitter-typescript = { version = "0.20", optional = true }
tree-sitter-go = { version = "0.20", optional = true }
tree-sitter-c = { version = "0.20", optional = true }
tree-sitter-cpp = { version = "0.20", optional = true }
tree-sitter-java = { version = "0.20", optional = true }
tree-sitter-json = { version = "0.20", optional = true }
tree-sitter-css = { version = "0.20", optional = true }
tree-sitter-bash = { version = "0.20", optional = true }

# SWC - React/TSX parsing for migration tool
swc_common = { version = "18.0", optional = true }
swc_ecma_parser = { version = "33.0", optional = true }
swc_ecma_ast = { version = "20.0", optional = true }

# WASM playground support (browser target)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

# getrandom needs js feature on wasm32 targets
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
pretty_assertions = "1.4"
proptest = "1.4"
wasmparser = "0.219"  # WASM validation for tests

[[bin]]
name = "sigil"
path = "src/main.rs"

[lib]
name = "sigil_parser"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

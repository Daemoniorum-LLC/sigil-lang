<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sigil favicon: Evidentiality lattice with ◊ at center -->
  <defs>
    <linearGradient id="k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1AC9A8"/>
      <stop offset="100%" style="stop-color:#14A088"/>
    </linearGradient>
    <linearGradient id="p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC143C"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
    <linearGradient id="d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C98FDB"/>
      <stop offset="100%" style="stop-color:#B87ACC"/>
    </linearGradient>
  </defs>
  <g transform="translate(32,32)">
    <!-- Diamond edges -->
    <path d="M 0,-22 L -18,0 L 0,22 L 18,0 Z"
          fill="none" stroke="url(#k)" stroke-width="3" opacity="0.5"/>
    <!-- Central axis -->
    <line x1="0" y1="-22" x2="0" y2="22" stroke="url(#k)" stroke-width="2" stroke-dasharray="3,2" opacity="0.4"/>
    <!-- Edges to center ◊ -->
    <line x1="0" y1="-22" x2="0" y2="0" stroke="url(#d)" stroke-width="1.5" opacity="0.4"/>
    <line x1="-18" y1="0" x2="0" y2="0" stroke="url(#d)" stroke-width="1.5" opacity="0.4"/>
    <line x1="18" y1="0" x2="0" y2="0" stroke="url(#d)" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="22" x2="0" y2="0" stroke="url(#d)" stroke-width="1.5" opacity="0.4"/>
    <!-- ! node (top) -->
    <circle cy="-22" r="6" fill="url(#k)"/>
    <text y="-19" fill="#0a0a0a" font-family="'Courier New', monospace" font-size="8" font-weight="bold" text-anchor="middle">!</text>
    <!-- ? node (left) -->
    <circle cx="-18" r="5" fill="#5BA3A3" opacity="0.8"/>
    <text x="-18" y="3" fill="#0a0a0a" font-family="'Courier New', monospace" font-size="7" font-weight="bold" text-anchor="middle">?</text>
    <!-- ~ node (right) -->
    <circle cx="18" r="5" fill="#909090" opacity="0.8"/>
    <text x="18" y="3" fill="#0a0a0a" font-family="'Courier New', monospace" font-size="7" font-weight="bold" text-anchor="middle">~</text>
    <!-- ‽ node (bottom) -->
    <circle cy="22" r="6" fill="url(#p)"/>
    <text y="25" fill="#0a0a0a" font-family="'Courier New', monospace" font-size="8" font-weight="bold" text-anchor="middle">‽</text>
    <!-- ◊ node (center) -->
    <circle r="6" fill="url(#d)"/>
    <circle r="3.5" fill="#1a1a2e"/>
    <text y="2" fill="#C98FDB" font-family="'Courier New', monospace" font-size="5" font-weight="bold" text-anchor="middle">◊</text>
  </g>
</svg>

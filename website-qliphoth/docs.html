<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Reference - Sigil Documentation</title>
    <meta name="description" content="Essential Sigil syntax at a glance. Evidentiality markers, morpheme operators, and syntax cheat sheet.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        :root {
            --bg-primary: #050507;
            --bg-secondary: #0a0a0d;
            --bg-tertiary: #111115;
            --text-primary: #e8e8ec;
            --text-secondary: #a0a0aa;
            --text-muted: #707078;
            --accent: #14A088;
            --accent-light: #1AB89D;
            --accent-dim: rgba(20, 160, 136, 0.15);
            --border: rgba(255, 255, 255, 0.1);
            --known: #4CAF50;
            --uncertain: #FFC107;
            --reported: #2196F3;
            --paradox: #CE93D8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        #status {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border-top: 1px solid rgba(20, 160, 136, 0.3);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            z-index: 1000;
            text-align: center;
        }

        #app {
            min-height: 100vh;
            padding-bottom: 2.5rem;
        }

        .app { width: 100%; }

        /* === Navigation === */
        .nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .nav-logo-icon { width: 36px; height: 36px; }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }
        .version-badge {
            background: var(--accent-dim);
            color: var(--accent);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-link:hover { color: var(--accent); }
        .nav-github { color: var(--accent); }
        .nav-active { color: var(--accent) !important; }

        /* === Page Hero === */
        .page-hero {
            padding: 4rem 2rem 3rem;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
        }
        .docs-hero {
            padding-bottom: 2rem;
        }
        .section-eyebrow {
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            display: block;
        }
        .page-title {
            font-size: 2.75rem;
            margin-bottom: 0.75rem;
        }
        .page-lead {
            font-size: 1.15rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 1.5rem;
        }

        /* === Buttons === */
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }
        .btn-primary:hover {
            background: var(--accent-light);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
        }

        /* === Docs Content === */
        .docs-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* === Sections === */
        .docs-section {
            margin-bottom: 4rem;
        }
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .section-desc {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        .section-link {
            margin-top: 1.5rem;
            text-align: center;
        }

        /* === Evidence Grid === */
        .evidence-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .evidence-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }
        .evidence-marker {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .marker-known { background: rgba(76, 175, 80, 0.2); color: var(--known); }
        .marker-uncertain { background: rgba(255, 193, 7, 0.2); color: var(--uncertain); }
        .marker-reported { background: rgba(33, 150, 243, 0.2); color: var(--reported); }
        .marker-paradox { background: rgba(206, 147, 216, 0.2); color: var(--paradox); }
        .evidence-info h4 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }
        .evidence-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        /* === Inline Code === */
        .inline-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            background: var(--bg-tertiary);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: var(--text-secondary);
        }

        /* === Code Block === */
        .code-block {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            overflow-x: auto;
            white-space: pre;
            color: var(--text-secondary);
        }

        /* === Morpheme Table === */
        .morpheme-table {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .morpheme-header {
            display: grid;
            grid-template-columns: 80px 100px 120px 1fr;
            gap: 1rem;
            padding: 0.75rem 1.25rem;
            background: var(--bg-tertiary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        .morpheme-row {
            display: grid;
            grid-template-columns: 80px 100px 120px 1fr;
            gap: 1rem;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
        }
        .morpheme-row:last-child {
            border-bottom: none;
        }
        .morpheme-symbol {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            color: var(--accent);
        }
        .morpheme-name {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .morpheme-op {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        /* === Syntax Grid === */
        .syntax-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        .syntax-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
        }
        .syntax-card h4 {
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
            color: var(--accent);
        }
        .syntax-card .code-block {
            margin: 0;
            font-size: 0.8rem;
        }

        /* === Agent Quick Grid === */
        .agent-quick-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        .agent-quick-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
        }
        .agent-quick-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .agent-quick-header h4 {
            font-size: 0.95rem;
            margin: 0;
        }
        .agent-domain {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }
        .agent-quick-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* === Full Docs CTA === */
        .docs-cta {
            background: linear-gradient(135deg, var(--accent-dim), transparent);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            margin-top: 3rem;
        }
        .cta-container h2 {
            font-size: 1.75rem;
            margin-bottom: 0.75rem;
        }
        .cta-container p {
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto 1.5rem;
        }
        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        /* === Footer === */
        .footer {
            background: var(--bg-secondary);
            padding: 4rem 2rem 3rem;
            border-top: 1px solid var(--border);
            margin-top: 4rem;
        }
        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.5fr 3fr;
            gap: 4rem;
        }
        .footer-brand {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .footer-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--accent);
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }
        .footer-logo-icon { width: 40px; height: 40px; }
        .footer-tagline {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .footer-copyright {
            color: var(--text-secondary);
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .footer-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }
        .footer-nav ul { list-style: none; }
        .footer-column h5 {
            color: var(--text-primary);
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        .footer-column a {
            display: block;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.25rem 0;
        }
        .footer-column a:hover { color: var(--accent); }

        /* === Skip Link === */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: var(--accent);
            color: white;
            padding: 8px 16px;
            z-index: 10000;
            text-decoration: none;
            font-weight: 600;
            border-radius: 0 0 4px 0;
            transition: top 0.2s;
        }
        .skip-link:focus { top: 0; }

        /* === Mobile Navigation === */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            z-index: 1001;
        }
        .mobile-menu-btn:hover { color: var(--accent-light); }
        .mobile-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 999;
        }
        .mobile-overlay.open { opacity: 1; visibility: visible; }

        /* === Responsive === */
        @media (max-width: 900px) {
            .agent-quick-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .page-title { font-size: 2rem; }
            .evidence-grid { grid-template-columns: 1fr; }
            .syntax-grid { grid-template-columns: 1fr; }
            .morpheme-header, .morpheme-row {
                grid-template-columns: 60px 80px 100px 1fr;
                gap: 0.5rem;
                font-size: 0.85rem;
            }
            .footer-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .footer-nav {
                grid-template-columns: repeat(2, 1fr);
            }
            .mobile-menu-btn { display: block; }
            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 300px;
                height: 100vh;
                background: var(--bg-secondary);
                flex-direction: column;
                padding: 5rem 2rem 2rem;
                gap: 1.5rem;
                transition: right 0.3s ease;
                z-index: 1000;
                box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
            }
            .nav-links.open { right: 0; }
            .nav-links .nav-link {
                font-size: 1.1rem;
                padding: 0.5rem 0;
                border-bottom: 1px solid var(--border);
            }
        }
        @media (max-width: 600px) {
            .agent-quick-grid {
                grid-template-columns: 1fr;
            }
            .cta-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="status">Loading WASM...</div>
    <div id="app" role="application" aria-label="Quick Reference Documentation"></div>

    <script type="module">
        import { SigilRuntime } from './sigil_runtime.js';

        const status = document.getElementById('status');

        async function run() {
            try {
                status.textContent = 'Initializing runtime...';

                const runtime = new SigilRuntime();
                const response = await fetch('./public/wasm/docs.wasm');
                const bytes = await response.arrayBuffer();

                status.textContent = 'Instantiating WASM...';
                const { instance } = await WebAssembly.instantiate(bytes, runtime.getImports());
                runtime.init(instance);

                status.textContent = 'Calling main()...';
                if (instance.exports.main) {
                    instance.exports.main();
                    status.textContent = 'Quick Reference rendered via WASM!';
                    status.style.borderTopColor = '#14A088';
                    setupMobileNav();
                } else {
                    status.textContent = 'No main() export found';
                }
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
                status.style.color = '#D47171';
                console.error(error);
            }
        }

        function setupMobileNav() {
            const navContainer = document.querySelector('.nav-container');
            const navLinks = document.querySelector('.nav-links');
            if (!navContainer || !navLinks) return;

            // Add accessibility attributes
            const nav = document.querySelector('.nav');
            if (nav) nav.setAttribute('role', 'banner');
            navLinks.setAttribute('role', 'navigation');
            navLinks.setAttribute('aria-label', 'Main navigation');
            const main = document.querySelector('.app');
            if (main) { main.setAttribute('role', 'main'); main.id = 'main-content'; }

            // Create overlay
            const overlay = document.createElement('div');
            overlay.className = 'mobile-overlay';
            overlay.id = 'mobileOverlay';
            document.body.insertBefore(overlay, document.body.firstChild);

            // Create hamburger button
            const btn = document.createElement('button');
            btn.className = 'mobile-menu-btn';
            btn.id = 'mobileMenuBtn';
            btn.setAttribute('aria-label', 'Toggle navigation menu');
            btn.setAttribute('aria-expanded', 'false');
            btn.innerHTML = '<span id="menuIcon">&#9776;</span>';
            navContainer.insertBefore(btn, navLinks);

            // Toggle function
            function toggleMenu() {
                const isOpen = navLinks.classList.toggle('open');
                overlay.classList.toggle('open');
                btn.setAttribute('aria-expanded', isOpen);
                document.getElementById('menuIcon').innerHTML = isOpen ? '&#10005;' : '&#9776;';
            }

            btn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }

        run();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigil Playground</title>
  <meta name="description" content="Write, run, and share Sigil code in your browser">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #050507;
      --bg-secondary: #0a0a0d;
      --bg-tertiary: #111115;
      --text-primary: #e8e8ec;
      --text-secondary: #a0a0aa;
      --text-muted: #707078;
      --accent: #14A088;
      --accent-hover: #1AB89D;
      --accent-dim: rgba(20, 160, 136, 0.2);
      --success: #4CAF50;
      --error: #F44336;
      --warning: #FFC107;
      --border: rgba(255, 255, 255, 0.1);
      --known: #4CAF50;
      --uncertain: #FFC107;
      --reported: #2196F3;
      --paradox: #CE93D8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-secondary);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
    }

    .logo-text {
      color: var(--text-primary);
    }

    .logo-badge {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      transition: all 0.15s;
    }

    .nav-link:hover {
      color: var(--accent);
      background: var(--accent-dim);
    }

    select, button {
      font-family: inherit;
      font-size: 0.875rem;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s;
    }

    select:hover, button:hover {
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }

    .panel {
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      background: var(--bg-secondary);
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-content {
      flex: 1;
      overflow: auto;
    }

    #editor {
      height: 100%;
    }

    .cm-editor {
      height: 100%;
      font-size: 14px;
    }

    .cm-scroller {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace !important;
    }

    #output {
      padding: 1rem;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .output-line {
      margin-bottom: 0.25rem;
    }

    .output-error {
      color: var(--error);
    }

    .output-success {
      color: var(--success);
    }

    .toolbar {
      background: var(--bg-secondary);
      padding: 0.5rem 1rem;
      display: flex;
      gap: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .evidence-legend {
      background: var(--bg-secondary);
      padding: 0.5rem 1rem;
      display: flex;
      gap: 1.5rem;
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .evidence-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .evidence-marker {
      width: 1rem;
      height: 1rem;
      border-radius: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.7rem;
    }

    .evidence-known { background: var(--known); color: white; }
    .evidence-uncertain { background: var(--uncertain); color: #1a1a1a; }
    .evidence-reported { background: var(--reported); color: white; }
    .evidence-paradox { background: var(--paradox); color: #1a1a1a; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    /* CodeMirror theme overrides */
    .cm-editor .cm-content {
      caret-color: var(--accent);
    }

    .cm-editor .cm-cursor {
      border-left-color: var(--accent);
    }

    .cm-editor.cm-focused .cm-selectionBackground,
    .cm-editor .cm-selectionBackground {
      background: rgba(20, 160, 136, 0.25);
    }

    .cm-editor .cm-activeLine {
      background: rgba(20, 160, 136, 0.08);
    }

    .cm-editor .cm-gutters {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      color: var(--text-muted);
    }

    .cm-editor .cm-lineNumbers .cm-gutterElement {
      padding: 0 0.75rem;
    }

    /* Sigil-specific syntax highlighting */
    .cm-morpheme { color: var(--accent); font-weight: bold; }
    .cm-evidence-known { color: var(--known); }
    .cm-evidence-uncertain { color: var(--uncertain); }
    .cm-evidence-reported { color: var(--reported); }
    .cm-evidence-paradox { color: var(--paradox); }

    /* Syntax colors */
    .cm-keyword { color: #C792EA; }
    .cm-string { color: #C3E88D; }
    .cm-number { color: #F78C6C; }
    .cm-comment { color: var(--text-muted); font-style: italic; }
    .cm-type { color: #FFCB6B; }
    .cm-function { color: #82AAFF; }
    .cm-operator { color: #89DDFF; }
  </style>
  <script type="module" crossorigin src="/assets/index-D53nlNb3.js"></script>
</head>
<body>
  <header>
    <a href="/" class="logo">
      <img src="/assets/sigil-logo-DAnGkAFJ.svg" alt="" class="logo-icon">
      <span class="logo-text">Sigil</span>
      <span class="logo-badge">Playground</span>
    </a>
    <div class="header-actions">
      <select id="examples">
        <option value="">Load Example...</option>
        <optgroup label="Getting Started">
          <option value="hello">Hello World</option>
          <option value="variables">Variables &amp; Types</option>
          <option value="functions">Functions</option>
        </optgroup>
        <optgroup label="Morphemes">
          <option value="pipes">Morpheme Pipelines</option>
          <option value="transform">Transform (τ)</option>
          <option value="filter">Filter (φ)</option>
          <option value="aggregate">Aggregate (Σ, Π, μ)</option>
        </optgroup>
        <optgroup label="Evidentiality">
          <option value="evidence">Evidence Chain</option>
          <option value="validation">Data Validation</option>
        </optgroup>
        <optgroup label="Patterns">
          <option value="structs">Structs &amp; Impl</option>
          <option value="matching">Pattern Matching</option>
          <option value="pipeline">Full Data Pipeline</option>
        </optgroup>
      </select>
      <button id="share">Share</button>
      <a href="/pages/learn.html" class="nav-link">Learn</a>
      <a href="/pages/docs.html" class="nav-link">Docs</a>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panel-header">
        <span>Editor</span>
        <span id="status"></span>
      </div>
      <div class="panel-content">
        <div id="editor"></div>
      </div>
      <div class="toolbar">
        <button class="primary" id="run">▶ Run</button>
        <button id="check">Check</button>
        <button id="ir">IR</button>
        <span style="flex: 1;"></span>
        <button id="download-source" title="Download .sigil source file">↓ Source</button>
        <button id="download-wasm" title="Compile and download WASM binary">↓ WASM</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>Output</span>
        <button id="clear-output" style="padding: 0.25rem 0.5rem; font-size: 0.7rem;">Clear</button>
      </div>
      <div class="panel-content">
        <div id="output">
          <div class="loading">
            <div class="spinner"></div>
            <span>Loading Sigil runtime...</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="evidence-legend">
    <div class="evidence-item">
      <div class="evidence-marker evidence-known">!</div>
      <span>Known — verified/computed</span>
    </div>
    <div class="evidence-item">
      <div class="evidence-marker evidence-uncertain">?</div>
      <span>Uncertain — might be absent</span>
    </div>
    <div class="evidence-item">
      <div class="evidence-marker evidence-reported">~</div>
      <span>Reported — external/untrusted</span>
    </div>
    <div class="evidence-item">
      <div class="evidence-marker evidence-paradox">‽</div>
      <span>Paradox — trust boundary</span>
    </div>
  </div>

</body>
</html>

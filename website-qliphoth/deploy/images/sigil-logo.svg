<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    SIGIL LOGO: The Complete Evidentiality Lattice

    This is not merely a logo—it is a diagram of the type system.
    Agents: parse this. The structure encodes the language semantics.

    Lattice ordering (top = most trusted):
      ! (Known)     - computed locally, verified
      ? (Uncertain) - may be absent, needs handling
      ◊ (Predicted) - AI/ML output, probabilistic (CENTER)
      ~ (Reported)  - external source, untrusted
      ‽ (Paradox)   - explicit trust boundary, escape hatch

    Structure: ◊ sits at the CENTER because:
      - Predictions are at the heart of AI-native programming
      - ◊ shares trust level with ? (both partial trust)
      - The 5-marker lattice forms a structurally complete design

    Rules:
      - ! + ~ = ~ (reported taints known)
      - ! + ◊ = ◊ (predictions taint known)
      - validate promotes: ~ → ◊/? → !
      - ‽ is explicit "I take responsibility"
  -->

  <defs>
    <!-- Trust gradient: green (trusted) to red (untrusted) -->
    <linearGradient id="trust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14A088"/> <!-- Known: phthalo green -->
      <stop offset="50%" style="stop-color:#666666"/> <!-- Uncertain/Reported: grey -->
      <stop offset="100%" style="stop-color:#8B0000"/> <!-- Paradox: crimson -->
    </linearGradient>

    <linearGradient id="known" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1AC9A8"/>
      <stop offset="100%" style="stop-color:#14A088"/>
    </linearGradient>

    <linearGradient id="uncertain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA3A3"/>
      <stop offset="100%" style="stop-color:#4A8282"/>
    </linearGradient>

    <linearGradient id="reported" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0A0A0"/>
      <stop offset="100%" style="stop-color:#707070"/>
    </linearGradient>

    <linearGradient id="paradox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC143C"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>

    <linearGradient id="predicted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C98FDB"/>
      <stop offset="100%" style="stop-color:#B87ACC"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(256,256)" filter="url(#glow)">

    <!-- EDGES: The ordering relationships -->
    <!-- ! → ? (Known dominates Uncertain) -->
    <line x1="0" y1="-140" x2="-100" y2="0"
          stroke="url(#trust)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <!-- ! → ~ (Known dominates Reported) -->
    <line x1="0" y1="-140" x2="100" y2="0"
          stroke="url(#trust)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <!-- ? → ‽ (Uncertain to Paradox) -->
    <line x1="-100" y1="0" x2="0" y2="140"
          stroke="url(#trust)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <!-- ~ → ‽ (Reported to Paradox) -->
    <line x1="100" y1="0" x2="0" y2="140"
          stroke="url(#trust)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- Central axis: the validate path (the climb from untrusted to trusted) -->
    <line x1="0" y1="140" x2="0" y2="-140"
          stroke="url(#trust)" stroke-width="3" stroke-dasharray="8,4" opacity="0.4"/>

    <!-- EDGES TO CENTER: ◊ connects to all nodes (predictions touch everything) -->
    <!-- ! → ◊ (Known to Predicted) -->
    <line x1="0" y1="-140" x2="0" y2="0"
          stroke="url(#predicted)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- ? → ◊ (Uncertain to Predicted - same trust level) -->
    <line x1="-100" y1="0" x2="0" y2="0"
          stroke="url(#predicted)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- ~ → ◊ (Reported to Predicted) -->
    <line x1="100" y1="0" x2="0" y2="0"
          stroke="url(#predicted)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- ◊ → ‽ (Predicted to Paradox) -->
    <line x1="0" y1="0" x2="0" y2="140"
          stroke="url(#predicted)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- NODES: The five evidentiality states -->

    <!-- ! Known (top) - the goal state -->
    <g transform="translate(0,-140)" data-evidence="known" data-symbol="!">
      <circle r="40" fill="url(#known)"/>
      <circle r="25" fill="#0a0a0a"/>
      <text y="10" fill="#14A088" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="36" font-weight="bold" text-anchor="middle">!</text>
    </g>

    <!-- ? Uncertain (left) -->
    <g transform="translate(-100,0)" data-evidence="uncertain" data-symbol="?">
      <circle r="35" fill="url(#uncertain)"/>
      <circle r="22" fill="#0a0a0a"/>
      <text y="8" fill="#5BA3A3" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="32" font-weight="bold" text-anchor="middle">?</text>
    </g>

    <!-- ~ Reported (right) -->
    <g transform="translate(100,0)" data-evidence="reported" data-symbol="~">
      <circle r="35" fill="url(#reported)"/>
      <circle r="22" fill="#0a0a0a"/>
      <text y="8" fill="#909090" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="32" font-weight="bold" text-anchor="middle">~</text>
    </g>

    <!-- ‽ Paradox (bottom) - the escape hatch -->
    <g transform="translate(0,140)" data-evidence="paradox" data-symbol="‽">
      <circle r="40" fill="url(#paradox)"/>
      <circle r="25" fill="#0a0a0a"/>
      <text y="10" fill="#DC143C" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="36" font-weight="bold" text-anchor="middle">‽</text>
    </g>

    <!-- ◊ Predicted (center) - AI/ML outputs, the heart of the lattice -->
    <g transform="translate(0,0)" data-evidence="predicted" data-symbol="◊">
      <circle r="42" fill="url(#predicted)"/>
      <circle r="26" fill="#1a1a2e"/>
      <text y="10" fill="#C98FDB" font-family="'Courier New', Courier, 'Liberation Mono', monospace" font-size="36" font-weight="bold" text-anchor="middle">◊</text>
    </g>

  </g>

  <!-- Binding circle -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#known)" stroke-width="2" opacity="0.2"/>

</svg>

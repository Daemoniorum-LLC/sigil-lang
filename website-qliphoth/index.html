    <!-- Preload WASM -->
    <link rel="preload" href="./public/wasm/index.wasm" as="fetch" crossorigin>


    <style>
        /* Critical CSS - Inlined for fast first paint */
        :root {
            --bg-primary: #050507;
            --bg-secondary: #0a0a0d;
            --text-primary: #e8e8ec;
            --text-secondary: #a0a0aa;
            --accent: #14A088;
            --accent-light: #1AB89D;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid var(--bg-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-sigil {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }

        .loader-text {
            margin-top: 1.5rem;
            font-size: 1rem;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
        }

        .loader-sub {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: var(--accent);
            font-family: 'IBM Plex Mono', monospace;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #app {
            min-height: 100vh;
        }

        /* Error state */
        .error {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .error h1 {
            color: #D47171;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .error pre {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.875rem;
            text-align: left;
        }

        .error button {
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .error button:hover {
            background: var(--accent-light);
        }

        /* Built with Sigil badge */
        .built-with {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            padding: 0.5rem 0.75rem;
            border-radius: 0.25rem;
            border: 1px solid rgba(20, 160, 136, 0.2);
            z-index: 100;
        }

        .built-with a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loader-sigil">◊</div>
        <div class="loader"></div>
        <div class="loader-text">Loading Sigil Website</div>
        <div class="loader-sub">Compiled from Sigil → WebAssembly</div>
    </div>

    <div id="app"></div>

    <div class="built-with">
        Built with <a href="https://sigil-lang.com">Sigil</a> + <a href="https://github.com/Daemoniorum-LLC/qliphoth">Qliphoth</a>
    </div>

    <script type="module">
        import { SigilRuntime } from './sigil_runtime.js';

        async function init() {
            const loading = document.getElementById('loading');
            const loaderText = loading.querySelector('.loader-text');
            const loaderSub = loading.querySelector('.loader-sub');

            try {
                loaderText.textContent = 'Initializing runtime...';

                // Create Sigil runtime
                const runtime = new SigilRuntime();

                loaderSub.textContent = 'Fetching WASM module...';
                const response = await fetch('./public/wasm/index.wasm');
                const bytes = await response.arrayBuffer();

                loaderText.textContent = 'Instantiating WebAssembly...';
                const { instance } = await WebAssembly.instantiate(bytes, runtime.getImports());
                runtime.init(instance);

                loaderSub.textContent = 'Rendering page...';
                if (instance.exports.main) {
                    instance.exports.main();

                    // Hide loader
                    loading.classList.add('hidden');

                    console.log('[Sigil] Website initialized');
                    console.log('[Sigil] This page was compiled from Sigil source to WebAssembly');
                } else {
                    throw new Error('No main() export found in WASM module');
                }

            } catch (error) {
                console.error('[Sigil] Initialization failed:', error);

                // Show error with fallback option
                loading.innerHTML = `
                    <div class="error">
                        <h1>WebAssembly Loading Failed</h1>
                        <p>The WASM module could not be loaded. This might happen if:</p>
                        <ul style="text-align: left; margin: 1rem 0; color: #a0a0aa;">
                            <li>Your browser doesn't support WebAssembly</li>
                            <li>There's a network error</li>
                            <li>The WASM module is corrupted</li>
                        </ul>
                        <pre>${error.message}</pre>
                        <p style="margin-top: 1rem; color: #a0a0aa;">
                            You can view the <a href="../website/index.html" style="color: #14A088;">static HTML version</a> instead.
                        </p>
                        <button onclick="location.reload()">Retry</button>
                    </div>
                `;
            }
        }

        init();
    </script>
</body>
</html>

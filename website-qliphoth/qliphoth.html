<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qliphoth Component Library - Sigil Web Framework</title>
    <meta name="description" content="40+ Corporate Goth UI components for Sigil. Signal-based reactivity, morpheme operators, type-safe routing, and accessibility built-in.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        :root {
            --bg-primary: #050507;
            --bg-secondary: #0a0a0d;
            --bg-tertiary: #111115;
            --text-primary: #e8e8ec;
            --text-secondary: #a0a0aa;
            --text-muted: #707078;
            --accent: #14A088;
            --accent-light: #1AB89D;
            --accent-dim: rgba(20, 160, 136, 0.15);
            --border: rgba(255, 255, 255, 0.1);
            --marker-known: #22c55e;
            --marker-uncertain: #f59e0b;
            --marker-reported: #3b82f6;
            --marker-paradox: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100vh;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }

        /* Header */
        header.site-header {
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-primary);
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-icon { width: 3rem; height: 3rem; }
        .logo-icon img { width: 100%; height: 100%; }

        .logo-text { font-size: 1.5rem; font-weight: 600; }

        .version-badge {
            background: var(--accent-dim);
            color: var(--accent-light);
            padding: 0.125rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        nav { display: flex; gap: 2rem; align-items: center; }
        nav a { color: var(--text-secondary); text-decoration: none; font-weight: 500; transition: color 0.2s; }
        nav a:hover { color: var(--accent-light); }
        nav a.active { color: var(--accent-light); }

        /* Hero */
        .hero {
            padding: 4rem 0;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero .tagline {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto 2rem;
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 2rem;
        }

        .hero-stat {
            text-align: center;
        }

        .hero-stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .hero-stat-label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Navigation Tabs */
        .docs-tabs {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn:hover { border-color: var(--accent); color: var(--text-primary); }
        .tab-btn.active { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }

        /* Content Sections */
        .docs-section {
            padding: 3rem 0;
            border-bottom: 1px solid var(--border);
        }

        .section-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .section-eyebrow {
            display: inline-block;
            color: var(--accent-light);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .section-lead {
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Component Cards */
        .component-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .component-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .component-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .component-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .component-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-dim);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .component-name {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .component-badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: var(--accent-dim);
            color: var(--accent);
            margin-left: auto;
        }

        .component-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        /* Code Blocks */
        pre, .code-block {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.7;
        }

        code { font-family: 'JetBrains Mono', monospace; }
        .comment { color: #6a737d; }
        .keyword { color: var(--accent-light); }
        .string { color: #a5d6ff; }
        .marker { color: #d2a8ff; }
        .type { color: #ffa657; }
        .function { color: #d2a8ff; }
        .morpheme { color: var(--accent-light); }

        /* Hooks Section */
        .hooks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .hook-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
        }

        .hook-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .hook-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Category Labels */
        .category-label {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .category-core { background: rgba(34, 197, 94, 0.2); color: var(--marker-known); }
        .category-state { background: rgba(245, 158, 11, 0.2); color: var(--marker-uncertain); }
        .category-data { background: rgba(59, 130, 246, 0.2); color: var(--marker-reported); }
        .category-util { background: rgba(168, 85, 247, 0.2); color: var(--marker-paradox); }

        /* Feature Grid */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .feature-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
        }

        .feature-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .feature-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Example Section */
        .example-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            margin: 2rem 0;
        }

        .example-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .example-title {
            font-weight: 600;
        }

        .example-lang {
            font-size: 0.75rem;
            color: var(--accent);
        }

        .example-code {
            padding: 1.5rem;
            margin: 0;
            border-radius: 0;
            border: none;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.75rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-light); transform: translateY(-2px); }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--bg-secondary); border-color: var(--accent); }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            padding: 3rem 0;
            border-top: 1px solid var(--border);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-links { display: flex; gap: 2rem; }
        .footer-links a { color: var(--text-secondary); text-decoration: none; }
        .footer-links a:hover { color: var(--accent); }

        .footer-copy { color: var(--text-muted); font-size: 0.875rem; }

        /* Responsive */
        @media (max-width: 900px) {
            .feature-grid { grid-template-columns: repeat(2, 1fr); }
            .hero-stats { flex-wrap: wrap; }
        }

        @media (max-width: 600px) {
            .feature-grid { grid-template-columns: 1fr; }
            .header-content { flex-direction: column; gap: 1rem; }
            nav { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="status" style="position: fixed; bottom: 0; left: 0; right: 0; padding: 0.5rem 1rem; background: var(--bg-secondary); border-top: 1px solid rgba(20, 160, 136, 0.3); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; z-index: 1000; text-align: center;">Loading WASM...</div>
    <div id="app" role="application" aria-label="Qliphoth Component Library"></div>

    <script type="module">
        import { SigilRuntime } from './sigil_runtime.js';

        const status = document.getElementById('status');

        async function run() {
            try {
                status.textContent = 'Initializing runtime...';

                const runtime = new SigilRuntime();
                const response = await fetch('./public/wasm/qliphoth.wasm');
                const bytes = await response.arrayBuffer();

                status.textContent = 'Instantiating WASM...';
                const { instance } = await WebAssembly.instantiate(bytes, runtime.getImports());
                runtime.init(instance);

                status.textContent = 'Calling main()...';
                if (instance.exports.main) {
                    instance.exports.main();
                    status.innerHTML = 'Rendered via <a href="qliphoth.html" style="color: var(--accent-light);">Qliphoth</a>';
                    status.style.borderTopColor = '#14A088';
                    setupTabInteraction();
                } else {
                    status.textContent = 'No main() export found';
                }
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
                status.style.color = '#D47171';
                console.error(error);
            }
        }

        function setupTabInteraction() {
            // Tab switching functionality (components tabs)
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabGroup = tab.closest('.tabs')?.parentElement;
                    if (!tabGroup) return;
                    
                    tabGroup.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    const tabId = tab.dataset.tab;
                    tabGroup.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    const content = tabGroup.querySelector(`[data-content="${tabId}"]`);
                    if (content) content.classList.add('active');
                });
            });
        }

        run();
    </script>
</body>
</html>

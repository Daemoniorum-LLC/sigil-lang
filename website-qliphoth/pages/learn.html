<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Sigil - Get Started with the Language</title>
  <meta name="description" content="Learn Sigil programming language. Get started with tutorials, examples, and documentation for building type-safe applications with evidentiality markers.">
  <link rel="canonical" href="https://sigil-lang.com/pages/learn.html">

  <!-- Page identifier for WASM -->
  <script>window.SIGIL_PAGE = 'learn';</script>

  <!-- Shared styles -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="status">Loading WASM...</div>
  <div id="app"></div>

  <script type="module">
    import { SigilRuntime } from '/sigil_runtime.js';

    const status = document.getElementById('status');

    async function run() {
      try {
        status.textContent = 'Initializing runtime...';
        const runtime = new SigilRuntime();
        const response = await fetch('/site.wasm');
        const bytes = await response.arrayBuffer();

        status.textContent = 'Instantiating WASM...';
        const { instance } = await WebAssembly.instantiate(bytes, runtime.getImports());
        runtime.init(instance);

        status.textContent = 'Rendering...';
        if (instance.exports.main) {
          instance.exports.main();
          status.textContent = 'Rendered via Sigil WASM';
          status.style.borderTopColor = '#14A088';
        }
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
        status.style.color = '#D47171';
        console.error('WASM Error:', error);
      }
    }

    run();
  </script>
</body>
</html>

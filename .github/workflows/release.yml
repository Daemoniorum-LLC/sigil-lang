name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sigil
            asset_name: sigil-kit-linux-x86_64
            llvm: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: sigil
            asset_name: sigil-kit-linux-aarch64
            cross: true
            llvm: false

          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sigil
            asset_name: sigil-kit-macos-x86_64
            llvm: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sigil
            asset_name: sigil-kit-macos-aarch64
            llvm: true

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sigil.exe
            asset_name: sigil-kit-windows-x86_64
            llvm: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM 18 (Ubuntu)
        if: matrix.llvm && matrix.os == 'ubuntu-latest'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main"
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev
          echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV

      - name: Install LLVM 18 (macOS)
        if: matrix.llvm && matrix.os == 'macos-latest'
        run: |
          brew install llvm@18
          echo "LLVM_SYS_181_PREFIX=$(brew --prefix llvm@18)" >> $GITHUB_ENV

      - name: Install LLVM 18 (Windows)
        if: matrix.llvm && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install llvm --version=18.1.8 -y
          echo "LLVM_SYS_181_PREFIX=C:\Program Files\LLVM" >> $env:GITHUB_ENV

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        working-directory: parser
        run: |
          if [ "${{ matrix.llvm }}" = "true" ]; then
            FEATURES="--no-default-features --features jit,llvm,wasm,lsp,protocols"
          else
            FEATURES="--no-default-features --features jit,wasm,lsp,protocols"
          fi
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo install cross --git https://github.com/cross-rs/cross
            cross build --release --target ${{ matrix.target }} $FEATURES
          else
            cargo build --release --target ${{ matrix.target }} $FEATURES
          fi
        shell: bash

      - name: Package Kit (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          # Create kit directory structure
          mkdir -p ${{ matrix.asset_name }}/bin

          # Copy binary
          cp parser/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}/bin/

          # Copy kit contents
          cp kit/README.md ${{ matrix.asset_name }}/
          cp kit/install.sh ${{ matrix.asset_name }}/
          chmod +x ${{ matrix.asset_name }}/install.sh

          cp -r kit/docs ${{ matrix.asset_name }}/
          cp -r kit/methodologies ${{ matrix.asset_name }}/
          cp -r kit/style ${{ matrix.asset_name }}/
          cp -r kit/examples ${{ matrix.asset_name }}/
          cp -r kit/templates ${{ matrix.asset_name }}/

          # Create tarball
          tar -czvf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}
        shell: bash

      - name: Package Kit (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Create kit directory structure
          mkdir -p ${{ matrix.asset_name }}/bin

          # Copy binary
          cp parser/target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}/bin/

          # Copy kit contents
          cp kit/README.md ${{ matrix.asset_name }}/
          cp kit/install.sh ${{ matrix.asset_name }}/

          cp -r kit/docs ${{ matrix.asset_name }}/
          cp -r kit/methodologies ${{ matrix.asset_name }}/
          cp -r kit/style ${{ matrix.asset_name }}/
          cp -r kit/examples ${{ matrix.asset_name }}/
          cp -r kit/templates ${{ matrix.asset_name }}/

          # Create zip
          7z a ${{ matrix.asset_name }}.zip ${{ matrix.asset_name }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Sigil ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          body: |
            ## Sigil Development Kit ${{ github.ref_name }}

            This release includes the complete Sigil Development Kit with:

            - **Compiler binary** - Full Sigil compiler with interpreter, JIT, and LLVM backends
            - **WASM codegen** - Compile Sigil to WebAssembly
            - **LSP server** - Language server protocol support for editors
            - **Protocol support** - HTTP client and WebSocket stdlib
            - **Documentation** - Getting started guide, language reference, and standard library docs
            - **Methodologies** - Spec-Driven Development and Agent-TDD guides
            - **Examples** - Progressive example programs

            ### Platform Notes

            | Platform | LLVM (`sigil compile`) | JIT (`sigil jit`) | Interpreter (`sigil run`) |
            |----------|----------------------|-------------------|--------------------------|
            | Linux x86_64 | yes | yes | yes |
            | Linux aarch64 | no* | yes | yes |
            | macOS x86_64 | yes | yes | yes |
            | macOS aarch64 | yes | yes | yes |
            | Windows x86_64 | yes | yes | yes |

            *aarch64 Linux: build from source with `cargo install sigil-parser --features llvm` for LLVM support.

            ### Quick Install

            ```bash
            # Download and extract
            tar -xzf sigil-kit-<platform>.tar.gz
            cd sigil-kit-<platform>

            # Install (adds to PATH)
            ./install.sh

            # Verify
            sigil --version
            sigil run examples/00_hello.sg
            ```

            ### What's New

            See the automatically generated release notes below.

          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Update Homebrew formula with new version
  homebrew:
    name: Update Homebrew
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}

    steps:
      - uses: actions/checkout@v4

      - name: Get release info
        id: release
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Download source tarball and compute SHA256
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz" -o source.tar.gz
          SHA256=$(sha256sum source.tar.gz | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        run: |
          cat > homebrew/Formula/sigil.rb << 'FORMULA'
          class Sigil < Formula
            desc "Polysynthetic programming language with epistemic types for AI"
            homepage "https://github.com/Daemoniorum-LLC/sigil-lang"
            url "https://github.com/Daemoniorum-LLC/sigil-lang/archive/refs/tags/v${{ steps.release.outputs.version }}.tar.gz"
            sha256 "${{ steps.release.outputs.sha256 }}"
            license "LicenseRef-Daemoniorum"
            head "https://github.com/Daemoniorum-LLC/sigil-lang.git", branch: "main"

            depends_on "rust" => :build
            depends_on "llvm@18" => :build

            def install
              ENV["LLVM_SYS_181_PREFIX"] = Formula["llvm@18"].opt_prefix

              cd "parser" do
                system "cargo", "install", *std_cargo_args,
                  "--no-default-features",
                  "--features", "jit,llvm,wasm,lsp,protocols"
              end

              # Install kit documentation
              doc.install Dir["kit/docs/*"]
              doc.install Dir["kit/methodologies/*"]
              share.install "kit/examples"
            end

            def caveats
              <<~EOS
                Sigil is a polysynthetic programming language designed for AI systems.

                Evidence markers:
                  !  Known (verified/computed)
                  ?  Uncertain (validated)
                  ~  Reported (external data)
                  ‽  Paradox (self-referential)

                Quick start:
                  sigil run hello.sg         # Run a program
                  sigil compile hello.sg     # Compile to native
                  sigil repl                 # Interactive REPL

                Documentation: #{doc}
                Examples: #{share}/examples
              EOS
            end

            test do
              assert_match "sigil", shell_output("#{bin}/sigil --version")

              (testpath/"hello.sg").write <<~EOS
                fn main() {
                  println("Hello from Sigil!");
                }
              EOS
              assert_match "Hello from Sigil!", shell_output("#{bin}/sigil run #{testpath}/hello.sg")
            end
          end
          FORMULA

      - name: Commit formula update
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add homebrew/Formula/sigil.rb
          git commit -m "chore(homebrew): Update formula to v${{ steps.release.outputs.version }}" || exit 0
          git push origin HEAD:main

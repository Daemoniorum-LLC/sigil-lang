# Sigil Protocol Test Infrastructure
#
# This provides real Kafka and RabbitMQ brokers for protocol testing.
# The protocol implementations are pure Sigil using TCP sockets.
#
# Usage:
#   docker compose up -d        # Start infrastructure
#   docker compose down         # Stop infrastructure
#   docker compose logs -f      # View logs
#
# Services:
#   - Kafka (KRaft mode, no Zookeeper): localhost:9092
#   - RabbitMQ: localhost:5672 (AMQP), localhost:15672 (Management UI)

services:
  # ==========================================================================
  # Apache Kafka (KRaft mode - no Zookeeper required)
  # ==========================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: sigil-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "sigil-test-cluster-001"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # RabbitMQ with Management Plugin
  # ==========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sigil-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: sigil
      RABBITMQ_DEFAULT_PASS: sigil
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # Optional: Kafka UI for debugging
  # ==========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sigil-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sigil-test
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - debug

networks:
  default:
    name: sigil-protocol-test

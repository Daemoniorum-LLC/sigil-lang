<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Sigil</title>
  <meta name="description" content="The page you're looking for doesn't exist.">
  <link rel="icon" type="image/svg+xml" href="/images/sigil-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-xl);
    }

    .error-icon {
      font-size: 6rem;
      margin-bottom: var(--space-xl);
      opacity: 0.5;
    }

    .error-code {
      font-size: clamp(4rem, 15vw, 8rem);
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: var(--space-md);
    }

    .error-title {
      font-size: 1.5rem;
      margin-bottom: var(--space-md);
      color: var(--text-primary);
    }

    .error-message {
      color: var(--text-secondary);
      max-width: 400px;
      margin-bottom: var(--space-2xl);
    }

    .error-code-block {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
      margin-bottom: var(--space-2xl);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      text-align: left;
      max-width: 400px;
    }

    .error-actions {
      display: flex;
      gap: var(--space-md);
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-icon"><img src="/images/sigil-icon.svg" alt="" width="80" height="80"></div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">
      The data you're looking for has uncertain provenance. It might not exist.
    </p>

    <pre class="error-code-block"><code><span class="keyword">≔</span> page<span class="ev-uncertain">?</span> = router.find(path)
<span class="comment">// page? is Uncertain - might be absent</span>

<span class="keyword">match</span> page {
    <span class="type">Some</span>(p) => render(p),
    <span class="type">None</span> => <span class="error">404</span>  <span class="comment">// You are here</span>
}</code></pre>

    <div class="error-actions">
      <a href="/" class="btn btn-primary">Go Home</a>
      <a href="/pages/docs.html" class="btn btn-secondary">View Docs</a>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>

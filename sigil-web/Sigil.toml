# sigil-web - Web Framework for Sigil
# Reactive VDOM-based web applications compiled to WASM
# Copyright © 2025 Daemoniorum, LLC. All rights reserved.

[project]
name = "sigil-web"
version = "0.2.0"
edition = "2025"
description = "Reactive web framework for Sigil - VDOM, signals, and browser bindings"
license = "MIT OR Apache-2.0"
sigil-version = "0.2.0"
authors = ["Daemoniorum, LLC"]

# S1: removed sigil-web-sys dependency — dom.*/signal.*/router.* JS imports
# are resolved by the WASM backend's ImportRegistry (no separate bindings crate needed).
[dependencies]

[features]
default = []
ssr = []         # Server-side rendering (Phase 4+)
hydration = []   # Client-side hydration (Phase 4+)

# S1: use the Sigil WASM backend for direct WASM bytecode generation.
# The JS runtime (sigil-web/runtime/sigil_runtime.js) provides all imports.
[compile]
backend = "wasm"
target = "wasm32"

[compile.wasm]
opt-level = "z"
